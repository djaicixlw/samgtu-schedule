<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Расписание СамГТУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
    <script>
      (function () {
        try {
          var tg = window.Telegram && Telegram.WebApp;
          var pref = localStorage.getItem('theme_pref');
          var dark = pref ? pref === 'dark'
            : tg && tg.colorScheme ? tg.colorScheme === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches;
          var r = document.documentElement;
          r.classList.toggle('dark', dark);
          r.style.backgroundColor = dark ? '#020617' : '#eaeff5';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#eaeff5] dark:bg-slate-950 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
