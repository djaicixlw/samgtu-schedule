<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Shield Outline -->
  <path d="M64 12 L104 26 C104 68 84 98 64 116 C44 98 24 68 24 26 Z" fill="url(#shieldBg)" stroke="url(#goldRim)" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner Thin Golden Line -->
  <path d="M64 20 L96 32 C96 66 80 90 64 106 C48 90 32 66 32 32 Z" fill="none" stroke="url(#goldRim)" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Top 3 Academic Stars -->
  <g fill="url(#goldRim)" transform="translate(0, -2)">
    <!-- Center star -->
    <polygon points="64,30 66,35 71,35 67,38 69,43 64,40 59,43 61,38 57,35 62,35"/>
    <!-- Left star -->
    <polygon points="50,34 51.5,38 55.5,38 52.5,40.5 54,44.5 50,42 46,44.5 47.5,40.5 44.5,38 48.5,38" transform="scale(0.85) translate(10, 8)"/>
    <!-- Right star -->
    <polygon points="78,34 79.5,38 83.5,38 80.5,40.5 82,44.5 78,42 74,44.5 75.5,40.5 72.5,38 76.5,38" transform="scale(0.85) translate(18, 8)"/>
  </g>
  <!-- Center Course / University Symbol: Stylized 3 or С -->
  <text x="64" y="80" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-1">3</text>
  <text x="64" y="96" text-anchor="middle" fill="url(#goldRim)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="2">КУРС</text>
</svg>
