<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="neoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Main Rounded Background with Shadow -->
  <rect x="10" y="10" width="108" height="108" rx="30" fill="url(#neoGradient)" filter="url(#glow)"/>
  <!-- Stylized Minimal Calendar Body -->
  <rect x="30" y="32" width="68" height="64" rx="14" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-width="3"/>
  <!-- Calendar Header Bar -->
  <path d="M30 46 L98 46" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Ring Binders -->
  <line x1="46" y1="24" x2="46" y2="34" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="82" y1="24" x2="82" y2="34" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Clock / Bell Accent In Center -->
  <circle cx="64" cy="68" r="16" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="64,58 64,68 72,72" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small Pulse Dot (Live Schedule indicator) -->
  <circle cx="86" cy="38" r="4" fill="#22c55e"/>
</svg>
