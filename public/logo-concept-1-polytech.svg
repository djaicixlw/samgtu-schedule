<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="polytechBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#polytechBg)" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.3"/>
  <!-- Stylized Engineering Gear -->
  <g transform="translate(64,64)" fill="none" stroke="url(#goldAccent)" stroke-width="6" stroke-linecap="round">
    <circle r="34" stroke-width="5" opacity="0.9"/>
    <!-- 8 Gear Cogs -->
    <line x1="0" y1="-42" x2="0" y2="-34"/>
    <line x1="0" y1="34" x2="0" y2="42"/>
    <line x1="-42" y1="0" x2="-34" y2="0"/>
    <line x1="34" y1="0" x2="42" y2="0"/>
    <line x1="-30" y1="-30" x2="-24" y2="-24"/>
    <line x1="24" y1="24" x2="30" y2="30"/>
    <line x1="-30" y1="30" x2="-24" y2="24"/>
    <line x1="24" y1="-24" x2="30" y2="-30"/>
  </g>
  <!-- Academic Graduation Cap / Book in Center -->
  <path d="M64 42 L88 54 L64 66 L40 54 Z" fill="url(#goldAccent)"/>
  <path d="M48 60 L48 76 C48 83 80 83 80 76 L80 60" fill="none" stroke="url(#goldAccent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M88 56 L88 78 L85 80" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Text Monogram СамГТУ -->
  <text x="64" y="105" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">САМГТУ</text>
</svg>
