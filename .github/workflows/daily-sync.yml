name: Daily SamGTU Schedule Sync

on:
  schedule:
    # Запуск каждую ночь в 23:00 UTC (03:00 ночи по Самаре, UTC+4)
    - cron: '0 23 * * *'
  workflow_dispatch:
    # Возможность ручного запуска из интерфейса GitHub в любой момент

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: true

jobs:
  sync-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Nightly Schedule Sync & Audit
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DEV_CHAT_ID: ${{ secrets.DEV_CHAT_ID || secrets.TELEGRAM_DEV_CHAT_ID || secrets.TELEGRAM_CHANNEL_ID }}
          AUTO_APPLY: 'true'
        run: npx tsx scripts/nightly_sync.ts --apply

      - name: Commit and push changes if schedule was updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add constants.ts public/schedules/
          if [ -n "$(git status --porcelain constants.ts public/schedules/)" ]; then
            git commit -m "chore(schedule): automated nightly sync with official SamGTU API"
            git push
            echo "Changes pushed to repository. Pages deployment will automatically trigger."
          else
            echo "No schedule changes detected in constants.ts or public/schedules/."
          fi
